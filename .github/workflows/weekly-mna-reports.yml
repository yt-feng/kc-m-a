name: Weekly M&A case reports

on:
  schedule:
    # 05:00 every Friday in Beijing = 21:00 every Thursday UTC.
    - cron: "0 21 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly or backfill"
        required: false
        default: "weekly"
      count:
        description: "Number of reports to generate. For backfill, use 5-10 per run."
        required: false
        default: "4"
      min_domestic:
        description: "Minimum domestic China-related reports"
        required: false
        default: "2"
      days:
        description: "Weekly lookback days"
        required: false
        default: "7"
      offset:
        description: "Skip N selected cases for batched backfill"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-mna-case-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate_reports:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      REPORT_MODE: ${{ github.event.inputs.mode || 'weekly' }}
      REPORT_COUNT: ${{ github.event.inputs.count || '4' }}
      REPORT_MIN_DOMESTIC: ${{ github.event.inputs.min_domestic || '2' }}
      REPORT_LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
      REPORT_OFFSET: ${{ github.event.inputs.offset || '0' }}
      REPORT_OUTPUT_ROOT: case_reports
      REPORT_MAX_RAW_ITEMS: "450"
      REPORT_CONTINUE_ON_ERROR: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate M&A case reports
        run: python -m mna_case_reports.main --mode "$REPORT_MODE" --count "$REPORT_COUNT" --min-domestic "$REPORT_MIN_DOMESTIC" --days "$REPORT_LOOKBACK_DAYS" --offset "$REPORT_OFFSET" --output-root "$REPORT_OUTPUT_ROOT"

      - name: Validate DOCX format and text
        shell: bash
        run: |
          if [ -d case_reports ]; then
            mkdir -p case_reports/_manifests
            python -m mna_case_reports.docx_validate case_reports --write-json "case_reports/_manifests/docx_format_validation_${{ github.run_id }}.json"
          else
            echo "case_reports directory does not exist; skip DOCX validation."
            exit 1
          fi
