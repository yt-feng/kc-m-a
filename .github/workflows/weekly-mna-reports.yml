name: Weekly M&A case reports

on:
  schedule:
    # 06:00 every Monday in Beijing = 22:00 every Sunday UTC.
    - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly or backfill"
        required: false
        default: "weekly"
      count:
        description: "Number of reports to generate. For backfill, use 5-10 per run."
        required: false
        default: "4"
      min_domestic:
        description: "Minimum domestic China-related reports"
        required: false
        default: "2"
      days:
        description: "Weekly lookback days"
        required: false
        default: "7"
      offset:
        description: "Skip N selected cases for batched backfill"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-mna-case-reports-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate_reports:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      REPORT_MODE: ${{ github.event.inputs.mode || 'weekly' }}
      REPORT_COUNT: ${{ github.event.inputs.count || '4' }}
      REPORT_MIN_DOMESTIC: ${{ github.event.inputs.min_domestic || '2' }}
      REPORT_LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
      REPORT_OFFSET: ${{ github.event.inputs.offset || '0' }}
      REPORT_OUTPUT_ROOT: case_reports
      REPORT_MAX_RAW_ITEMS: "450"
      REPORT_CONTINUE_ON_ERROR: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate M&A case reports
        run: python -m mna_case_reports.main --mode "$REPORT_MODE" --count "$REPORT_COUNT" --min-domestic "$REPORT_MIN_DOMESTIC" --days "$REPORT_LOOKBACK_DAYS" --offset "$REPORT_OFFSET" --output-root "$REPORT_OUTPUT_ROOT"

      - name: Validate DOCX format and text
        shell: bash
        run: |
          if [ -d case_reports ]; then
            mkdir -p case_reports/_manifests
            python -m mna_case_reports.docx_validate case_reports --write-json "case_reports/_manifests/docx_format_validation_${{ github.run_id }}.json"
          else
            echo "case_reports directory does not exist; skip DOCX validation."
            exit 1
          fi

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "Generated report files:"
          if [ -d case_reports ]; then
            find case_reports -type f \( -name "*.docx" -o -path "*/_manifests/*.json" \) -print | sort | tail -120 || true
          else
            echo "case_reports directory does not exist."
          fi
          echo "Git status:"
          git status --short || true

      - name: Upload generated report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mna-case-reports-${{ github.run_id }}
          path: |
            case_reports/**/*.docx
            case_reports/_manifests/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d case_reports ]; then
            echo "No case_reports directory generated."
            exit 0
          fi

          report_count="$(find case_reports -type f \( -name "*.docx" -o -path "*/_manifests/*.json" \) -print | wc -l | tr -d ' ')"
          echo "Report files available before commit: $report_count"
          if [ "$report_count" = "0" ]; then
            echo "No report files generated."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          mkdir -p "$tmp_dir/case_reports"
          cp -a case_reports/. "$tmp_dir/case_reports/"
          commit_msg="chore: add M&A case reports $(date +'%Y-%m-%d')"

          for attempt in 1 2 3; do
            echo "Commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p case_reports
            cp -a "$tmp_dir/case_reports/." case_reports/
            git add case_reports
            if git diff --cached --quiet; then
              echo "No report changes to commit."
              exit 0
            fi
            git commit -m "$commit_msg"
            if git push origin HEAD:main; then
              echo "Pushed generated reports."
              exit 0
            fi
            echo "Push rejected, retrying after refreshing origin/main."
            sleep 5
          done

          echo "Failed to push generated reports after retries."
          exit 1
