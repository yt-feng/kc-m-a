name: Weekly M&A case reports

on:
  schedule:
    # 05:00 every Friday in Beijing = 21:00 every Thursday UTC.
    - cron: "0 21 * * 4"
  workflow_dispatch:
    inputs:
      mode:
        description: "weekly or backfill"
        required: false
        default: "weekly"
      count:
        description: "Number of reports to generate. For backfill, use 5-10 per run."
        required: false
        default: "4"
      min_domestic:
        description: "Minimum domestic China-related reports"
        required: false
        default: "2"
      days:
        description: "Weekly lookback days"
        required: false
        default: "7"
      offset:
        description: "Skip N selected cases for batched backfill"
        required: false
        default: "0"
      max_attempts:
        description: "Maximum candidates to try. Use 1 for a focused single-case smoke test."
        required: false
        default: "0"
      candidate_pool_max:
        description: "Maximum selected candidate pool size. Use 1 with max_attempts=1 for a single-case smoke test."
        required: false
        default: "0"
      candidate_timeout:
        description: "Per-candidate timeout seconds. Use 900-1200 for a focused single-case full draft."
        required: false
        default: "300"
      model_timeout:
        description: "Per-model-call timeout seconds."
        required: false
        default: "90"
      allow_draft_on_validation_failure:
        description: "Write a DOCX draft even if article quality validation fails. Manual smoke-test only."
        required: false
        default: "0"
      docx_validate_warn_only:
        description: "Do not fail the workflow on DOCX validator issues. Manual smoke-test only."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-mna-case-reports-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  generate_reports:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      REPORT_MODE: ${{ github.event.inputs.mode || 'weekly' }}
      REPORT_COUNT: ${{ github.event.inputs.count || '4' }}
      REPORT_MIN_DOMESTIC: ${{ github.event.inputs.min_domestic || '2' }}
      REPORT_LOOKBACK_DAYS: ${{ github.event.inputs.days || '7' }}
      REPORT_OFFSET: ${{ github.event.inputs.offset || '0' }}
      REPORT_OUTPUT_ROOT: case_reports
      REPORT_MAX_RAW_ITEMS: "220"
      REPORT_CONTINUE_ON_ERROR: "1"
      REPORT_MAX_REVISIONS: "1"
      REPORT_LENGTH_REWRITE_REVISIONS: "1"
      REPORT_FINAL_REPAIR_REVISIONS: "1"
      REPORT_MAX_GENERATION_ATTEMPTS: ${{ github.event.inputs.max_attempts || '0' }}
      REPORT_CANDIDATE_POOL_MAX: ${{ github.event.inputs.candidate_pool_max || '0' }}
      REPORT_PER_CANDIDATE_TIMEOUT_SECONDS: ${{ github.event.inputs.candidate_timeout || '300' }}
      REPORT_WORKER_HEARTBEAT_SECONDS: "30"
      REPORT_MODEL_TIMEOUT_SECONDS: ${{ github.event.inputs.model_timeout || '90' }}
      REPORT_ALLOW_DRAFT_ON_VALIDATION_FAILURE: ${{ github.event.inputs.allow_draft_on_validation_failure || '0' }}
      REPORT_DOCX_VALIDATE_WARN_ONLY: ${{ github.event.inputs.docx_validate_warn_only || '0' }}
      REPORT_EXPAND_ON_FAILURE: "0"
      REPORT_MIN_EXTERNAL_RESEARCH_ITEMS: "1"
      MNA_MAX_TITLE_URL_RESOLVES: "10"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mark report generation start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/weekly_reports_start_marker"

      - name: Generate M&A case reports
        run: python -m mna_case_reports.main --mode "$REPORT_MODE" --count "$REPORT_COUNT" --min-domestic "$REPORT_MIN_DOMESTIC" --days "$REPORT_LOOKBACK_DAYS" --offset "$REPORT_OFFSET" --output-root "$REPORT_OUTPUT_ROOT"

      - name: Collect generated weekly DOCX files
        shell: bash
        run: |
          set -euo pipefail
          find "$REPORT_OUTPUT_ROOT" -type f -name "*.docx" -newer "$RUNNER_TEMP/weekly_reports_start_marker" -print | sort > "$RUNNER_TEMP/generated_weekly_docx_files.txt" || true
          echo "Generated or overwritten DOCX files in this run:"
          cat "$RUNNER_TEMP/generated_weekly_docx_files.txt" || true
          if [ ! -s "$RUNNER_TEMP/generated_weekly_docx_files.txt" ]; then
            echo "No generated or overwritten DOCX files found for this run."
            echo "Recent DOCX files for debugging:"
            find "$REPORT_OUTPUT_ROOT" -type f -name "*.docx" -printf "%TY-%Tm-%Td %TH:%TM:%TS %p\n" | sort | tail -20 || true
            exit 1
          fi

      - name: Validate current DOCX format and text
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$REPORT_OUTPUT_ROOT" ]; then
            mkdir -p "$REPORT_OUTPUT_ROOT/_manifests"
            mapfile -t generated_docx < "$RUNNER_TEMP/generated_weekly_docx_files.txt"
            validate_args=()
            if [ "${REPORT_DOCX_VALIDATE_WARN_ONLY:-0}" = "1" ]; then
              validate_args+=(--warn-only)
            fi
            python -m mna_case_reports.docx_validate "${generated_docx[@]}" --write-json "$REPORT_OUTPUT_ROOT/_manifests/docx_format_validation_${{ github.run_id }}.json" "${validate_args[@]}"
            find "$REPORT_OUTPUT_ROOT/_manifests" -type f -name "*.json" -newer "$RUNNER_TEMP/weekly_reports_start_marker" -print | sort > "$RUNNER_TEMP/generated_weekly_manifest_files.txt" || true
            echo "Generated or overwritten manifest files in this run:"
            cat "$RUNNER_TEMP/generated_weekly_manifest_files.txt" || true
          else
            echo "$REPORT_OUTPUT_ROOT directory does not exist; skip DOCX validation."
            exit 1
          fi

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docx_list="$RUNNER_TEMP/generated_weekly_docx_files.txt"
          manifest_list="$RUNNER_TEMP/generated_weekly_manifest_files.txt"
          if [ ! -f "$docx_list" ] && [ -d "$REPORT_OUTPUT_ROOT" ] && [ -f "$RUNNER_TEMP/weekly_reports_start_marker" ]; then
            find "$REPORT_OUTPUT_ROOT" -type f -name "*.docx" -newer "$RUNNER_TEMP/weekly_reports_start_marker" -print | sort > "$docx_list" || true
          fi
          if [ ! -f "$manifest_list" ] && [ -d "$REPORT_OUTPUT_ROOT/_manifests" ] && [ -f "$RUNNER_TEMP/weekly_reports_start_marker" ]; then
            find "$REPORT_OUTPUT_ROOT/_manifests" -type f -name "*.json" -newer "$RUNNER_TEMP/weekly_reports_start_marker" -print | sort > "$manifest_list" || true
          fi
          echo "Generated DOCX files from this run:"
          if [ -f "$docx_list" ]; then
            cat "$docx_list"
          else
            echo "(none)"
          fi
          echo "Generated manifest files from this run:"
          if [ -f "$manifest_list" ]; then
            cat "$manifest_list"
            while IFS= read -r file; do
              if [ -z "$file" ] || [ ! -f "$file" ]; then
                continue
              fi
              echo "---- $file ----"
              cat "$file"
              echo
            done < "$manifest_list"
          else
            echo "(none)"
          fi
          echo "Git status:"
          git status --short || true

      - name: Prepare current report artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/current_report_artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"
          docx_list="$RUNNER_TEMP/generated_weekly_docx_files.txt"
          manifest_list="$RUNNER_TEMP/generated_weekly_manifest_files.txt"
          if [ ! -f "$docx_list" ] && [ -d "$REPORT_OUTPUT_ROOT" ] && [ -f "$RUNNER_TEMP/weekly_reports_start_marker" ]; then
            find "$REPORT_OUTPUT_ROOT" -type f -name "*.docx" -newer "$RUNNER_TEMP/weekly_reports_start_marker" -print | sort > "$docx_list" || true
          fi
          if [ ! -f "$manifest_list" ] && [ -d "$REPORT_OUTPUT_ROOT/_manifests" ] && [ -f "$RUNNER_TEMP/weekly_reports_start_marker" ]; then
            find "$REPORT_OUTPUT_ROOT/_manifests" -type f -name "*.json" -newer "$RUNNER_TEMP/weekly_reports_start_marker" -print | sort > "$manifest_list" || true
          fi
          for list in "$docx_list" "$manifest_list"; do
            if [ ! -f "$list" ]; then
              continue
            fi
            while IFS= read -r file; do
              if [ -z "$file" ] || [ ! -f "$file" ]; then
                continue
              fi
              mkdir -p "$artifact_dir/$(dirname "$file")"
              cp -f "$file" "$artifact_dir/$file"
            done < "$list"
          done
          echo "Prepared artifact files from this run:"
          find "$artifact_dir" -type f -print | sort || true

      - name: Upload generated report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mna-case-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/current_report_artifact
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -d "$REPORT_OUTPUT_ROOT" ]; then
            echo "No $REPORT_OUTPUT_ROOT directory generated."
            exit 0
          fi

          docx_list="$RUNNER_TEMP/generated_weekly_docx_files.txt"
          manifest_list="$RUNNER_TEMP/generated_weekly_manifest_files.txt"
          if [ ! -s "$docx_list" ]; then
            echo "No current-run DOCX files generated."
            exit 0
          fi
          report_count="$(cat "$docx_list" "$manifest_list" 2>/dev/null | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "Current-run report files available before commit: $report_count"
          if [ "$report_count" = "0" ]; then
            echo "No report files generated."
            exit 0
          fi

          tmp_dir="$(mktemp -d)"
          while IFS= read -r file; do
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              continue
            fi
            mkdir -p "$tmp_dir/$(dirname "$file")"
            cp -f "$file" "$tmp_dir/$file"
          done < <(cat "$docx_list" "$manifest_list" 2>/dev/null | sed '/^$/d')
          commit_msg="chore: add M&A case reports $(date +'%Y-%m-%d')"

          for attempt in 1 2 3; do
            echo "Commit attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            while IFS= read -r file; do
              if [ -z "$file" ] || [ ! -f "$tmp_dir/$file" ]; then
                continue
              fi
              mkdir -p "$(dirname "$file")"
              cp -f "$tmp_dir/$file" "$file"
              git add "$file"
            done < <(cat "$docx_list" "$manifest_list" 2>/dev/null | sed '/^$/d')
            if git diff --cached --quiet; then
              echo "No report changes to commit."
              exit 0
            fi
            git commit -m "$commit_msg"
            if git push origin HEAD:main; then
              echo "Pushed generated reports."
              exit 0
            fi
            echo "Push rejected, retrying after refreshing origin/main."
            sleep 5
          done

          echo "Failed to push generated reports after retries."
          exit 1
