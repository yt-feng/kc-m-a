name: Weekly M&A cases

on:
  schedule:
    # 05:00 every Friday in Beijing = 21:00 every Thursday UTC.
    - cron: "0 21 * * 4"
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days"
        required: false
        default: "7"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: deepseek-v4-flash
      MNA_OUTPUT_DIR: outputs
      DAYS: ${{ github.event.inputs.days || '7' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly M&A Excel
        run: python -m mna_weekly_tracker.main --days "$DAYS" --output-dir outputs

      - name: Commit generated Excel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/*.xlsx
          if git diff --cached --quiet; then
            echo "No Excel changes to commit."
          else
            git commit -m "chore: add weekly M&A cases $(date +'%Y-%m-%d')"
            git push
          fi
